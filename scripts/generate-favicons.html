<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Favicon Generator for ASDW</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
        }
        button {
            padding: 10px 20px;
            margin: 5px;
            cursor: pointer;
            background: #6366f1;
            color: white;
            border: none;
            border-radius: 5px;
        }
        button:hover {
            background: #4f46e5;
        }
        .preview {
            display: flex;
            gap: 20px;
            margin: 20px 0;
            flex-wrap: wrap;
        }
        .preview-item {
            border: 1px solid #ccc;
            padding: 10px;
            border-radius: 5px;
            text-align: center;
        }
        canvas {
            border: 1px solid #eee;
            margin: 10px 0;
        }
        #svgDisplay {
            border: 1px solid #ccc;
            padding: 20px;
            margin: 20px 0;
            background: #f5f5f5;
        }
    </style>
</head>
<body>
    <h1>ASDW Favicon & OG Image Generator</h1>

    <div id="svgDisplay"></div>

    <div class="preview" id="preview"></div>

    <div>
        <button onclick="generateAll()">Generate All Favicons & OG Image</button>
    </div>

    <script>
        const svgString = `<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:1" />
    </linearGradient>
  </defs>
  <circle cx="256" cy="256" r="240" fill="url(#bgGradient)"/>
  <text x="256" y="300" font-family="Arial, sans-serif" font-size="160" font-weight="bold" fill="white" text-anchor="middle">ASDW</text>
  <g transform="translate(256, 140)">
    <circle cx="0" cy="0" r="8" fill="white" opacity="0.9"/>
    <circle cx="-25" cy="-15" r="6" fill="white" opacity="0.7"/>
    <circle cx="25" cy="-15" r="6" fill="white" opacity="0.7"/>
  </g>
</svg>`;

        // Display SVG
        document.getElementById('svgDisplay').innerHTML = svgString;

        const sizes = [
            { name: 'favicon-16x16.png', size: 16 },
            { name: 'favicon-32x32.png', size: 32 },
            { name: 'apple-touch-icon.png', size: 180 },
            { name: 'android-chrome-192x192.png', size: 192 },
            { name: 'android-chrome-512x512.png', size: 512 }
        ];

        function svgToPng(size, callback) {
            const img = new Image();
            const blob = new Blob([svgString], { type: 'image/svg+xml' });
            const url = URL.createObjectURL(blob);

            img.onload = function() {
                const canvas = document.createElement('canvas');
                canvas.width = size;
                canvas.height = size;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(img, 0, 0, size, size);

                canvas.toBlob(function(blob) {
                    URL.revokeObjectURL(url);
                    callback(blob, canvas);
                }, 'image/png');
            };

            img.src = url;
        }

        function generateOGImage(callback) {
            const canvas = document.createElement('canvas');
            canvas.width = 1200;
            canvas.height = 630;
            const ctx = canvas.getContext('2d');

            // Background gradient
            const gradient = ctx.createLinearGradient(0, 0, 1200, 630);
            gradient.addColorStop(0, '#6366f1');
            gradient.addColorStop(1, '#3b82f6');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, 1200, 630);

            // Logo circle on the left
            const img = new Image();
            const blob = new Blob([svgString], { type: 'image/svg+xml' });
            const url = URL.createObjectURL(blob);

            img.onload = function() {
                // Draw logo
                ctx.drawImage(img, 50, 115, 400, 400);

                // Title
                ctx.fillStyle = 'white';
                ctx.font = 'bold 72px Arial';
                ctx.fillText('ASDW.KR', 500, 250);

                // Subtitle
                ctx.font = '36px Arial';
                ctx.fillText('무료 웹 도구 모음', 500, 320);

                // Description
                ctx.font = '24px Arial';
                ctx.fillStyle = 'rgba(255, 255, 255, 0.9)';
                ctx.fillText('29개 이상의 계산기, 변환기, 생성기', 500, 380);

                URL.revokeObjectURL(url);

                canvas.toBlob(function(blob) {
                    callback(blob, canvas);
                }, 'image/png');
            };

            img.src = url;
        }

        function downloadBlob(blob, filename) {
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            a.click();
            URL.revokeObjectURL(url);
        }

        function generateAll() {
            const preview = document.getElementById('preview');
            preview.innerHTML = '';

            // Generate favicons
            sizes.forEach(({name, size}) => {
                svgToPng(size, (blob, canvas) => {
                    const div = document.createElement('div');
                    div.className = 'preview-item';
                    div.innerHTML = `<p>${name}<br>${size}x${size}</p>`;
                    div.appendChild(canvas.cloneNode());

                    const btn = document.createElement('button');
                    btn.textContent = 'Download';
                    btn.onclick = () => downloadBlob(blob, name);
                    div.appendChild(btn);

                    preview.appendChild(div);

                    // Auto download
                    setTimeout(() => downloadBlob(blob, name), 100);
                });
            });

            // Generate OG image
            generateOGImage((blob, canvas) => {
                const div = document.createElement('div');
                div.className = 'preview-item';
                div.innerHTML = `<p>og-image.png<br>1200x630</p>`;

                const smallCanvas = document.createElement('canvas');
                smallCanvas.width = 400;
                smallCanvas.height = 210;
                const ctx = smallCanvas.getContext('2d');
                ctx.drawImage(canvas, 0, 0, 400, 210);
                div.appendChild(smallCanvas);

                const btn = document.createElement('button');
                btn.textContent = 'Download';
                btn.onclick = () => downloadBlob(blob, 'og-image.png');
                div.appendChild(btn);

                preview.appendChild(div);

                // Auto download
                setTimeout(() => downloadBlob(blob, 'og-image.png'), 200);
            });
        }
    </script>
</body>
</html>

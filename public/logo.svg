<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background circle -->
  <circle cx="256" cy="256" r="240" fill="url(#bgGradient)"/>

  <!-- ASDW Text -->
  <text x="256" y="300" font-family="Arial, sans-serif" font-size="160" font-weight="bold" fill="white" text-anchor="middle">
    ASDW
  </text>

  <!-- Small tools icon -->
  <g transform="translate(256, 140)">
    <circle cx="0" cy="0" r="8" fill="white" opacity="0.9"/>
    <circle cx="-25" cy="-15" r="6" fill="white" opacity="0.7"/>
    <circle cx="25" cy="-15" r="6" fill="white" opacity="0.7"/>
  </g>
</svg>
